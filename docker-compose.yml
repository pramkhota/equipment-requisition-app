version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: it-equipment-db
    environment:
      POSTGRES_USER: equipment_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: equipment_request_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipment_user -d equipment_request_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: it-equipment-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
