spring:
  application:
    name: equipment-request-service
  datasource:
    url: jdbc:postgresql://localhost:5432/equipment_request_db
    username: equipment_user
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Let Flyway handle the schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.ttb.equipment: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
